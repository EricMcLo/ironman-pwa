<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="70.3 Utah">
<title>70.3 Utah — Eric &amp; Ella</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17l4-7 3 4 3-6 5 9"/>
          <path d="M2 20h20"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-title">70.3 Utah</span>
        <span class="brand-sub" id="brandSub">Aug 21, 2027</span>
      </span>
    </div>

    <div class="seg" id="athleteSeg" role="group" aria-label="Whose plan">
      <button class="seg-btn" data-athlete="eric" aria-pressed="false">Eric</button>
      <button class="seg-btn" data-athlete="ella" aria-pressed="false">Ella</button>
      <button class="seg-btn" data-athlete="both" aria-pressed="true">Both</button>
    </div>

    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
      </svg>
    </button>
  </div>
</header>

<main id="main">

  <!-- ─────────────────────────── WEEK ─────────────────────────── -->
  <section class="view" id="view-week" aria-label="Week">
    <div class="banner" id="banner"></div>
    <div class="weekhead" id="weekHead"></div>
    <div class="weeklist" id="weekList"></div>
  </section>

  <!-- ─────────────────────────── MONTH ────────────────────────── -->
  <section class="view" id="view-month" aria-label="Month" hidden>
    <div class="monthhead">
      <button class="icon-btn small" id="prevMonth" aria-label="Previous month">‹</button>
      <h2 class="monthtitle" id="monthTitle"></h2>
      <button class="icon-btn small" id="nextMonth" aria-label="Next month">›</button>
    </div>
    <div class="dowrow" aria-hidden="true">
      <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
    </div>
    <div class="monthgrid" id="monthGrid"></div>
    <div class="legend" id="legend"></div>
  </section>

  <!-- ────────────────────────── PROGRESS ──────────────────────── -->
  <section class="view" id="view-progress" aria-label="Progress" hidden>
    <div class="statgrid" id="statGrid"></div>
    <div class="card chartcard">
      <div class="cardhead">
        <h2>Weekly hours</h2>
        <span class="hint" id="chartHint">planned vs completed</span>
      </div>
      <div class="chartwrap" id="chartWrap"></div>
    </div>
    <div class="card">
      <div class="cardhead"><h2>Phases</h2></div>
      <ol class="phaselist" id="phaseList"></ol>
    </div>
  </section>

  <div class="pad-bottom"></div>
</main>

<nav class="tabbar" role="tablist" aria-label="Views">
  <button class="tab" data-view="week" role="tab" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>
    </svg><span>Week</span>
  </button>
  <button class="tab" data-view="month" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/>
      <rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
    </svg><span>Month</span>
  </button>
  <button class="tab" data-view="progress" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M4 19V9M10 19V5M16 19v-6M22 19H2"/>
    </svg><span>Progress</span>
  </button>
</nav>

<!-- ─────────────────────────── SHEETS ─────────────────────────── -->
<div class="scrim" id="scrim" hidden></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-grab" aria-hidden="true"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/store.js"></script>
<script src="js/plan.js"></script>
<script src="js/ui.js"></script>
<script src="js/cal.js"></script>
<script src="js/app.js"></script>
</body>
</html>
